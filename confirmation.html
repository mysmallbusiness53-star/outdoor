<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmation | SOLARA Outdoor</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo"><div class="logo-icon">S</div> SOLARA</a>
    </div>
  </header>
  <div class="page-hero">
    <h1>Thank You</h1>
    <p>Your order has been received</p>
  </div>
  <div class="content-page text-center" id="confirmContent">
    <p>Loading...</p>
  </div>
  <script>
    const order = JSON.parse(sessionStorage.getItem('lastOrder') || 'null');
    if (order) {
      document.getElementById('confirmContent').innerHTML = `
        <h2 style="font-family:var(--font-heading);margin-bottom:16px">Order ${order.id}</h2>
        <p>Thank you, ${order.name}. We have received your order request.</p>
        <p style="margin:20px 0"><strong>Order Total:</strong> R ${order.total.toLocaleString('en-ZA')}</p>
        <p style="color:var(--medium-grey);max-width:500px;margin:0 auto 32px">
          <strong>Important:</strong> This is a demonstration confirmation. No payment has been processed
          and no order has been sent to a fulfilment system. To accept real orders, connect a payment
          gateway (PayFast, Yoco, etc.) and a backend order management system.
        </p>
        <p>A confirmation email would be sent to <strong>${order.email}</strong> once email service is configured.</p>
        <a href="shop.html" class="btn btn-primary" style="margin-top:32px">Continue Shopping</a>
      `;
    } else {
      document.getElementById('confirmContent').innerHTML = `
        <h2>No recent order</h2>
        <a href="shop.html" class="btn btn-primary">Shop Now</a>
      `;
    }
  </script>
</body>
</html>
