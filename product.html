<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product | SOLARA Outdoor</title>
  <meta name="description" content="Premium outdoor product details.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="announcement-bar">Free delivery on orders over R2 000</div>
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo"><div class="logo-icon">S</div> SOLARA</a>
      <nav class="main-nav" id="mainNav">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
      <div class="header-actions">
        <a href="cart.html" aria-label="Cart">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          <span class="cart-count" style="display:none">0</span>
        </a>
        <div class="mobile-menu-btn" id="menuBtn"><span></span><span></span><span></span></div>
      </div>
    </div>
  </header>

  <div id="productContent"></div>

  <section class="section" style="background:var(--white)">
    <div class="section-inner">
      <div class="section-header"><h2>You May Also Like</h2></div>
      <div class="product-grid" id="relatedGrid"></div>
    </div>
  </section>

  <footer class="site-footer">
    <div class="footer-grid">
      <div class="footer-brand"><a href="index.html" class="logo"><div class="logo-icon">S</div> SOLARA</a><p>Premium outdoor living essentials.</p></div>
      <div class="footer-col"><h4>Shop</h4><a href="shop.html">All Products</a></div>
      <div class="footer-col"><h4>Company</h4><a href="about.html">About</a><a href="contact.html">Contact</a></div>
      <div class="footer-col"><h4>Policies</h4><a href="returns.html">Returns</a><a href="privacy.html">Privacy</a></div>
    </div>
    <div class="footer-bottom"><p>&copy; 2026 SOLARA Outdoor.</p></div>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script>
    document.getElementById('menuBtn').addEventListener('click', () => document.getElementById('mainNav').classList.toggle('open'));

    const id = new URLSearchParams(location.search).get('id');
    const product = getProductById(id);

    if (!product) {
      document.getElementById('productContent').innerHTML = `<div class="empty-state"><h3>Product not found</h3><a href="shop.html" class="btn btn-primary">Back to Shop</a></div>`;
    } else {
      document.title = product.name + ' | SOLARA Outdoor';
      let selectedColor = product.colors[0];
      let qty = 1;

      function render() {
        const compare = product.comparePrice ? `<span class="price-compare">${formatPrice(product.comparePrice)}</span>` : '';
        const thumbs = product.images.map((img, i) =>
          `<img src="${img}" alt="" class="${i===0?'active':''}" onclick="setMainImage('${img}', this)">`
        ).join('');
        const colors = product.colors.map(c =>
          `<button class="variant-btn ${c===selectedColor?'active':''}" onclick="selectColor('${c}')">${c}</button>`
        ).join('');

        document.getElementById('productContent').innerHTML = `
          <div class="product-detail">
            <div class="product-gallery">
              <div class="product-gallery-main"><img id="mainImg" src="${product.images[0]}" alt="${product.name}"></div>
              <div class="product-gallery-thumbs">${thumbs}</div>
            </div>
            <div class="product-info">
              <p class="category">${product.categoryName}</p>
              <h1>${product.name}</h1>
              <div class="price-block">
                <span class="price-current">${formatPrice(product.price)}</span>
                ${compare}
              </div>
              <p class="short-desc">${product.shortDesc}</p>
              <div class="variant-selector">
                <label>Colour</label>
                <div class="variant-options">${colors}</div>
              </div>
              <div class="qty-selector">
                <button onclick="changeQty(-1)">−</button>
                <input type="number" id="qtyInput" value="1" min="1" max="${product.stock}" readonly>
                <button onclick="changeQty(1)">+</button>
              </div>
              <div class="product-actions">
                <button class="btn btn-primary" onclick="addToCart('${product.id}', qty, selectedColor)">Add to Cart</button>
                <a href="cart.html" class="btn btn-outline-dark">View Cart</a>
              </div>
              <div class="product-meta">
                <p><strong>Availability:</strong> ${product.stock > 0 ? 'In Stock (' + product.stock + ' available)' : 'Out of Stock'}</p>
                <p><strong>SKU:</strong> ${product.id.toUpperCase()}</p>
                <p style="margin-top:16px">${product.description}</p>
                <p style="margin-top:12px;font-size:0.8rem;color:var(--medium-grey)"><em>Note: Product details and pricing are placeholders. Please update with accurate supplier information before launch.</em></p>
              </div>
            </div>
          </div>`;
      }

      window.setMainImage = (src, el) => {
        document.getElementById('mainImg').src = src;
        document.querySelectorAll('.product-gallery-thumbs img').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
      };
      window.selectColor = (c) => { selectedColor = c; render(); };
      window.changeQty = (d) => {
        qty = Math.max(1, Math.min(product.stock, qty + d));
        document.getElementById('qtyInput').value = qty;
      };

      render();

      // Related
      const related = products.filter(p => p.category === product.category && p.id !== product.id).slice(0, 4);
      document.getElementById('relatedGrid').innerHTML = related.map(p => `
        <article class="product-card">
          <div class="product-card-image"><a href="product.html?id=${p.id}"><img src="${p.images[0]}" alt="${p.name}" loading="lazy"></a></div>
          <div class="product-card-body">
            <p class="product-card-category">${p.categoryName}</p>
            <h3 class="product-card-title"><a href="product.html?id=${p.id}">${p.name}</a></h3>
            <div class="product-card-price"><span class="price-current">${formatPrice(p.price)}</span></div>
            <button class="btn btn-primary btn-sm" onclick="addToCart('${p.id}')">Add to Cart</button>
          </div>
        </article>`).join('');
    }
  </script>
</body>
</html>
