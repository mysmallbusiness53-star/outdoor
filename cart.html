<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart | SOLARA Outdoor</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="announcement-bar">Free delivery on orders over R2 000</div>
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo"><div class="logo-icon">S</div> SOLARA</a>
      <nav class="main-nav" id="mainNav">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
      <div class="header-actions">
        <a href="cart.html" aria-label="Cart">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          <span class="cart-count" style="display:none">0</span>
        </a>
        <div class="mobile-menu-btn" id="menuBtn"><span></span><span></span><span></span></div>
      </div>
    </div>
  </header>

  <div class="page-hero"><h1>Your Cart</h1></div>

  <div class="cart-page" id="cartContent"></div>

  <footer class="site-footer">
    <div class="footer-bottom"><p>&copy; 2026 SOLARA Outdoor. Prices in ZAR.</p></div>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script>
    document.getElementById('menuBtn').addEventListener('click', () => document.getElementById('mainNav').classList.toggle('open'));

    function renderCart() {
      const cart = getCart();
      if (cart.length === 0) {
        document.getElementById('cartContent').innerHTML = `
          <div class="empty-state">
            <h3>Your cart is empty</h3>
            <p>Discover our curated collection of outdoor essentials.</p>
            <a href="shop.html" class="btn btn-primary">Continue Shopping</a>
          </div>`;
        return;
      }

      const subtotal = getCartTotal();
      const delivery = subtotal >= 2000 ? 0 : 150;
      const total = subtotal + delivery;

      let rows = cart.map(item => `
        <tr>
          <td>
            <div class="cart-item-info">
              <img src="${item.image}" alt="${item.name}">
              <div>
                <h4>${item.name}</h4>
                ${item.color ? `<p style="font-size:0.85rem;color:var(--medium-grey)">${item.color}</p>` : ''}
                <span class="remove-btn" onclick="removeFromCart('${item.id}','${item.color||''}');renderCart()">Remove</span>
              </div>
            </div>
          </td>
          <td>${formatPrice(item.price)}</td>
          <td>
            <div class="qty-selector">
              <button onclick="updateQty('${item.id}', ${item.qty-1}, '${item.color||''}');renderCart()">−</button>
              <input type="number" value="${item.qty}" readonly>
              <button onclick="updateQty('${item.id}', ${item.qty+1}, '${item.color||''}');renderCart()">+</button>
            </div>
          </td>
          <td>${formatPrice(item.price * item.qty)}</td>
        </tr>`).join('');

      document.getElementById('cartContent').innerHTML = `
        <table class="cart-table">
          <thead><tr><th>Product</th><th>Price</th><th>Quantity</th><th>Total</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
        <div class="cart-summary">
          <h3>Order Summary</h3>
          <div class="summary-row"><span>Subtotal</span><span>${formatPrice(subtotal)}</span></div>
          <div class="summary-row"><span>Delivery</span><span>${delivery === 0 ? 'FREE' : formatPrice(delivery)}</span></div>
          <div class="summary-row total"><span>Total</span><span>${formatPrice(total)}</span></div>
          <p style="font-size:0.8rem;color:var(--medium-grey);margin:12px 0 20px">Delivery estimate and final charges confirmed at checkout. Free delivery on orders over R2 000.</p>
          <a href="checkout.html" class="btn btn-primary btn-full">Proceed to Checkout</a>
          <a href="shop.html" class="btn btn-outline-dark btn-full" style="margin-top:12px">Continue Shopping</a>
        </div>`;
    }

    renderCart();
  </script>
</body>
</html>
