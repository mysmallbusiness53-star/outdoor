<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | SOLARA Outdoor</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="announcement-bar">Secure Checkout · SSL Encrypted</div>
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo"><div class="logo-icon">S</div> SOLARA</a>
      <div class="header-actions">
        <a href="cart.html" aria-label="Cart">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          <span class="cart-count" style="display:none">0</span>
        </a>
      </div>
    </div>
  </header>

  <div class="page-hero"><h1>Checkout</h1><p>Complete your order securely</p></div>

  <div class="checkout-page" id="checkoutContent"></div>

  <footer class="site-footer">
    <div class="footer-bottom"><p>&copy; 2026 SOLARA Outdoor. Secure checkout powered by your chosen payment provider.</p></div>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script>
    function renderCheckout() {
      const cart = getCart();
      if (cart.length === 0) {
        document.getElementById('checkoutContent').innerHTML = `
          <div class="empty-state" style="grid-column:1/-1">
            <h3>Your cart is empty</h3>
            <a href="shop.html" class="btn btn-primary">Shop Now</a>
          </div>`;
        return;
      }

      const subtotal = getCartTotal();
      const delivery = subtotal >= 2000 ? 0 : 150;
      const total = subtotal + delivery;

      const items = cart.map(i => `
        <div class="summary-row">
          <span>${i.name} × ${i.qty}</span>
          <span>${formatPrice(i.price * i.qty)}</span>
        </div>`).join('');

      document.getElementById('checkoutContent').innerHTML = `
        <div class="checkout-form">
          <h2>Contact & Delivery</h2>
          <form id="checkoutForm" onsubmit="return submitOrder(event)">
            <div class="form-group">
              <label>Email *</label>
              <input type="email" name="email" required placeholder="you@example.com">
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>First Name *</label>
                <input type="text" name="firstName" required>
              </div>
              <div class="form-group">
                <label>Last Name *</label>
                <input type="text" name="lastName" required>
              </div>
            </div>
            <div class="form-group">
              <label>Phone *</label>
              <input type="tel" name="phone" required placeholder="+27">
            </div>
            <div class="form-group">
              <label>Street Address *</label>
              <input type="text" name="address" required>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>City *</label>
                <input type="text" name="city" required>
              </div>
              <div class="form-group">
                <label>Province *</label>
                <select name="province" required>
                  <option value="">Select...</option>
                  <option>Eastern Cape</option>
                  <option>Free State</option>
                  <option>Gauteng</option>
                  <option>KwaZulu-Natal</option>
                  <option>Limpopo</option>
                  <option>Mpumalanga</option>
                  <option>North West</option>
                  <option>Northern Cape</option>
                  <option>Western Cape</option>
                </select>
              </div>
            </div>
            <div class="form-group">
              <label>Postal Code *</label>
              <input type="text" name="postal" required>
            </div>
            <div class="form-group">
              <label>Delivery Notes (optional)</label>
              <textarea name="notes" rows="3" placeholder="Gate codes, special instructions..."></textarea>
            </div>
            <h2 style="margin-top:40px">Payment</h2>
            <p style="color:var(--medium-grey);margin-bottom:20px;font-size:0.9rem">
              Payment gateway integration is required before live orders can be processed.
              Supported options for South Africa: PayFast, Yoco, Peach Payments, or Ozow.
              Configure your merchant credentials to enable secure card and EFT payments.
            </p>
            <div class="form-group">
              <label style="display:flex;align-items:center;gap:10px;text-transform:none;font-weight:400;cursor:pointer">
                <input type="checkbox" required style="width:auto">
                I agree to the <a href="terms.html" style="color:var(--gold-dark)">Terms & Conditions</a> and <a href="privacy.html" style="color:var(--gold-dark)">Privacy Policy</a>
              </label>
            </div>
            <button type="submit" class="btn btn-primary btn-full" style="margin-top:16px">Place Order — ${formatPrice(total)}</button>
            <p style="font-size:0.75rem;color:var(--medium-grey);margin-top:12px;text-align:center">
              This is a demonstration checkout. No payment will be processed until a payment provider is connected.
            </p>
          </form>
        </div>
        <div class="checkout-summary">
          <h3>Order Summary</h3>
          ${items}
          <div class="summary-row" style="margin-top:16px"><span>Subtotal</span><span>${formatPrice(subtotal)}</span></div>
          <div class="summary-row"><span>Delivery</span><span>${delivery === 0 ? 'FREE' : formatPrice(delivery)}</span></div>
          <div class="summary-row total"><span>Total</span><span>${formatPrice(total)}</span></div>
        </div>`;
    }

    function submitOrder(e) {
      e.preventDefault();
      // In production: send to backend / payment gateway
      const formData = new FormData(e.target);
      const orderId = 'SOL-' + Date.now().toString(36).toUpperCase();
      sessionStorage.setItem('lastOrder', JSON.stringify({
        id: orderId,
        total: getCartTotal() + (getCartTotal() >= 2000 ? 0 : 150),
        email: formData.get('email'),
        name: formData.get('firstName') + ' ' + formData.get('lastName')
      }));
      clearCart();
      window.location.href = 'confirmation.html';
      return false;
    }

    renderCheckout();
  </script>
</body>
</html>
